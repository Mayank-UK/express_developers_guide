# Secret EXAMPLE — template only, never real values (security topic: secrets
# management). The values below are base64 of "REPLACE-ME" placeholders.
# This app's validated AppConfig currently defines NO secret keys — these keys
# show the shape for the third-party adapters (SMTP email, payments) a real
# deployment would enable. Real secrets come from a secret manager
# (external-secrets, sealed-secrets, cloud KMS...) and are NEVER committed.
# Copy to a real Secret out-of-band: kubectl create secret ... or a manager.
apiVersion: v1
kind: Secret
metadata:
  name: express-guide-secrets
  namespace: express-guide
  labels:
    app.kubernetes.io/part-of: express-guide
type: Opaque
data:
  # e.g. nodemailer SMTP URL for the third-party topic's live email adapter
  SMTP_URL: "UkVQTEFDRS1NRQ=="
  # e.g. API key for the third-party topic's payments adapter
  STRIPE_API_KEY: "UkVQTEFDRS1NRQ=="
