# Explicit compose project name: without it, compose derives "docker" from
# this file's .docker/ parent dir, which shows as a bare "docker" group in
# Docker Desktop. Distinct from the dev stack's name so both stacks can run
# at once without sharing networks/volumes (mirrors the *_prod container
# naming scheme).
name: express_developers_guide_prod

services:
  server:
    build:
      context: ./../
      dockerfile: ./.docker/server/Dockerfile.prod
    image: express_guide_server_prod
    container_name: express_developers_guide_server_prod
    restart: unless-stopped
    # No published ports — the API stays internal; nginx's /api proxy is the
    # only caller. Debug hatch: - "127.0.0.1:4000:4000"
    env_file:
      - ./../server/.env.production
    environment:
      # Inside compose the optional services are reachable by service name,
      # not localhost — and environment: beats env_file:, so these win over
      # the .env.production values (MONGO_URI is unset there on purpose;
      # prod ships the full demo set, both services wired).
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/express_guide_prod
    volumes:
      # SQLITE_PATH=data/guide.db is relative to the image WORKDIR /app, so
      # /app/data is where the sqlite file lives; the named volume keeps the
      # database across container recreation.
      - server_data:/app/data
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first and the app binds IPv4 only.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend
      - backend
    depends_on:
      # Prod SHIPS the optional services, so the server waits for them: the
      # mongo client never reopens after a failed connect, and losing the
      # boot race would mark a demo off for the process lifetime. Dev stays
      # dependency-free — there the services are optional by design.
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./../
      dockerfile: ./.docker/client/Dockerfile.prod
    image: express_guide_client_prod
    container_name: express_developers_guide_client_prod
    restart: unless-stopped
    # No published ports — Caddy is the front door now (TLS on :443); nginx
    # is the internal app server behind it. Debug hatch (loopback, non-TLS):
    # - "127.0.0.1:8080:80"
    networks:
      - frontend
    depends_on:
      # Long form: the app tier waits for its API — and Caddy chains the
      # same gate one hop higher.
      server:
        condition: service_healthy
    healthcheck:
      # Prove the app tier answers, independent of the API gate.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: express_developers_guide_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  # Full demo parity: prod ships mongo too, so every demo is live. Like
  # redis, deliberately NO published ports — prod keeps the datastores
  # private to the backend network (dev publishes 6379/27017 for host-run
  # tooling; prod has no host-run tooling).
  mongo:
    image: mongo:7
    container_name: express_developers_guide_mongo_prod
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # TLS front door: terminates HTTPS for the DuckDNS hostname (automatic
  # Let's Encrypt, HTTP/3) and proxies to the client container inside the
  # compose network — the .docker/Caddyfile next to this file drives it.
  caddy:
    image: caddy:2-alpine
    container_name: express_developers_guide_caddy_prod
    restart: unless-stopped
    ports:
      # Caddy is the ONLY publicly published service now: 80 serves the
      # ACME HTTP-01 challenge + redirect, 443 is HTTPS (tcp + udp = HTTP/3).
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates persist across container recreation — without /data
      # every recreate re-provisions and burns Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      # Health-gated like every prod edge; the plain short form would race
      # a still-starting nginx.
      client:
        condition: service_healthy

networks:
  frontend:
  backend:

volumes:
  redis_data:
  server_data:
  mongo_data:
  caddy_data:
  caddy_config:
