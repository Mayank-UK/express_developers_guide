# PER-RELEASE APP STACK — booted per deploy under the project of one color:
#   COLOR=blue  IMAGE_TAG=sha-abc1234 docker compose -p edg_blue  -f <this file> up -d --wait
#   COLOR=green IMAGE_TAG=sha-def5678 docker compose -p edg_green -f <this file> up -d --wait
# The deploy script ALWAYS exports COLOR deliberately; the ${COLOR:-blue}
# default below only exists so a bare local `up` boots something (blue).
# There is deliberately NO top-level name: the -p flag names the project,
# and the two colors must never share one.
#
# The persistent platform (caddy + redis + mongo, project edg_platform) lives
# in docker-compose-platform.yml and is booted BEFORE any app stack: the
# mongo client never reopens a failed first connect, so the boot race is won
# by deploy ORDERING (platform `up -d --wait` fully healthy first) —
# depends_on cannot cross compose files. The app_internal network is
# project-scoped ON PURPOSE: each color's `server` service-name DNS resolves
# only within its own color, so nginx's baked `proxy_pass http://server:4000`
# always reaches the SAME color's API, never the other release's.
services:
  server:
    image: "ghcr.io/mayank-uk/express-guide-server:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: edg_server_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — the API stays internal; nginx's /api proxy is the
    # only caller. Debug hatch: - "127.0.0.1:4000:4000"
    env_file:
      - ./../server/.env.production
    environment:
      # The platform datastores are reachable by their network ALIASES on
      # the shared edg_backend network — and environment: beats env_file:,
      # so these win over the .env.production values (MONGO_URI is unset
      # there on purpose; prod ships the full demo set, both services
      # wired).
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/express_guide_prod
    volumes:
      # SQLITE_PATH=data/guide.db is relative to the image WORKDIR /app, so
      # /app/data is where the sqlite file lives; the named volume keeps the
      # database across container recreation — SHARED between colors (the
      # external legacy name), so a flip inherits the live data.
      - server_data:/app/data
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first and the app binds IPv4 only.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_internal
      - edg_backend

  client:
    image: "ghcr.io/mayank-uk/express-guide-client:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: edg_client_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — Caddy is the front door (TLS on :443) and reaches
    # this container BY NAME (edg_client_<color>) on the shared edg_frontend
    # network; nginx is the internal app server behind it. Debug hatch
    # (loopback, non-TLS): - "127.0.0.1:8080:80"
    networks:
      - app_internal
      - edg_frontend
    depends_on:
      # Long form: the app tier waits for its API — same color, same
      # project, so the gate still works per release.
      server:
        condition: service_healthy
    healthcheck:
      # Prove the app tier answers, independent of the API gate.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Plain project-scoped network: edg_blue_app_internal / edg_green_app_internal.
  # THIS is the isolation unit — nginx's `proxy_pass http://server:4000` and
  # this file's depends_on resolve `server` inside the color's own network.
  app_internal: {}
  # Shared with the platform stack (external, created by the deploy): caddy
  # reaches edg_client_<color> here.
  edg_frontend:
    name: edg_frontend
    external: true
  # Shared with the platform stack: redis + mongo live here by alias.
  edg_backend:
    name: edg_backend
    external: true

volumes:
  # LEGACY name from the single-stack era — external (created by the deploy)
  # and shared across colors so sqlite survives every flip.
  server_data:
    name: express_developers_guide_prod_server_data
    external: true
