server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text responses. The shared Caddy edge compresses too and skips
    # already-encoded upstreams — this covers any request that bypasses it.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Proxy API calls to the Express server (compose service name).
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite's content-hashed bundle lives under /assets/ — the hash IS the
    # version, the bytes can never change under the same URL: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: unknown paths serve the app, which renders the 404 view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document names the hashed assets, so it must revalidate on
    # every visit to pick up a new build's asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
