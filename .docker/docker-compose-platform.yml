# PERSISTENT PLATFORM STACK — booted once and untouched by releases.
#
# Project edg_platform owns everything that OUTLIVES a deployment: the two
# datastores (redis, mongo). The TLS edge is NOT in this file — it is the
# infra repo's ONE shared `caddy` container (its own compose project at
# /opt/caddy on the VM, the only publisher of 80/443, serving every app on
# the box), which joins the external edg_frontend network to reach this
# app's edg_client_<color> containers by name. The seam between the stacks
# is the FLIP FILE ~/express_developers_guide/platform/upstream.caddy (one
# line: reverse_proxy edg_client_<color>:80): the deploy writes it, the
# shared caddy bind-mounts it read-only, and a release activates the flip
# with `docker exec caddy caddy reload --config /etc/caddy/Caddyfile` —
# graceful, no TLS blip.
#
# The datastore boot-race guarantee (the mongo client never reopens a failed
# first connect — LOAD-BEARING, see the app file) is enforced by DEPLOY
# ORDERING here: `up -d --wait` must report redis and mongo healthy BEFORE
# any app stack starts; depends_on cannot cross compose files.
#
# Volumes are EXTERNAL on purpose: they keep their LEGACY names from the
# single-stack era (express_developers_guide_prod_*) so existing VM data is
# adopted, not lost — the deploy creates them idempotently before the first
# boot.
name: edg_platform

services:
  redis:
    image: redis:7-alpine
    container_name: edg_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      edg_backend:
        # The alias keeps the app stacks' REDIS_URL=redis://redis:6379
        # resolving without knowing this stack's service names.
        aliases:
          - redis

  # Full demo parity: prod ships mongo too, so every demo is live. Like
  # redis, deliberately NO published ports — prod keeps the datastores
  # private to the backend network.
  mongo:
    image: mongo:7
    container_name: edg_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      edg_backend:
        aliases:
          - mongo

networks:
  edg_backend:
    name: edg_backend
    external: true

volumes:
  # LEGACY names from the single-stack era — external so this stack adopts
  # the existing VM data instead of provisioning fresh volumes.
  redis_data:
    name: express_developers_guide_prod_redis_data
    external: true
  mongo_data:
    name: express_developers_guide_prod_mongo_data
    external: true
