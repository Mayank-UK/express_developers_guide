# CI: test the packages, scan for secrets, and publish production images.
name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: server/package-lock.json
            - run: npm ci
            - run: npm run test:coverage
            - run: npm run build

    client:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm test
            - run: npm run build

    secrets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v6

    build-push:
        name: Build and publish production images
        needs: [server, client, secrets]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: server
                      image: ghcr.io/mayank-uk/express-guide-server
                      dockerfile: .docker/server/Dockerfile.prod
                    - service: client
                      image: ghcr.io/mayank-uk/express-guide-client
                      dockerfile: .docker/client/Dockerfile.prod

        steps:
            - uses: actions/checkout@v4

            - name: Compute commit image tag
              id: image_tag
              shell: bash
              run: |
                  set -euo pipefail
                  short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
                  echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ matrix.image }}:${{ steps.image_tag.outputs.tag }}
                      ${{ matrix.image }}:master
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
